name: windows-vpn-build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.2
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          cache-on-failure: true
      - name: VPN crate tests
        run: cargo test --locked -p vpn
      - name: Check production build
        run: cargo check --locked -p serein --bin serein --no-default-features
      - name: Package app
        run: cargo xtask package
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: serein-windows-vpn
          path: dist/
